  <!-- Before/after sets. Each <img> is one slide, shown in this order; data-label is the heading above it. -->
  <div class="lightbox-set" id="set-1" hidden>
    <img data-src="images/mens-cuts/1-after-front.jpg" data-label="After" alt="After: front view">
    <img data-src="images/mens-cuts/2-after-side.jpg" data-label="After" alt="After: side view">
    <img data-src="images/mens-cuts/3-before-front.jpg" data-label="Before" alt="Before: front view">
    <img data-src="images/mens-cuts/4-before-side.jpg" data-label="Before" alt="Before: side view">
  </div>

  <dialog class="lightbox" id="lightbox" aria-label="Before and after photos">
    <button class="lb-close" aria-label="Close">&times;</button>
    <h2 class="lb-label"></h2>
    <div class="lb-stage">
      <button class="lb-arrow lb-prev" aria-label="Previous photo"><span>&#8249;</span></button>
      <img class="lb-img" src="" alt="">
      <button class="lb-arrow lb-next" aria-label="Next photo"><span>&#8250;</span></button>
    </div>
    <p class="lb-count"></p>
  </dialog>
