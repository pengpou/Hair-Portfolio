<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'self'; object-src 'none'">
  <meta name="robots" content="noindex, nofollow, noimageindex">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Instagram carousel | pphair</title>
  <link rel="icon" type="image/png" href="../icon-512.png">
  <link rel="stylesheet" href="../styles.css?v=51">
  <style>
    body { min-height: 100vh; padding: 1.5rem 1rem 3rem; text-align: center; background: radial-gradient(rgba(59, 42, 34, 0.12) 1.3px, transparent 1.6px) 0 0 / 24px 24px, var(--bg); }
    .ig-logo { font-family: var(--serif); font-weight: 800; font-size: 1.6rem; text-decoration: none; color: var(--ink); font-variation-settings: "SOFT" 100, "WONK" 1; }
    .ig-logo span { font-family: var(--hand); font-weight: 700; font-size: 1.8rem; color: var(--accent); }
    h1 { font-family: var(--serif); font-weight: 800; font-size: clamp(1.7rem, 6vw, 2.4rem); margin: 1.2rem 0 0.3rem; }
    .ig-sub { color: var(--muted); margin: 0 auto 1.6rem; max-width: 30rem; }
    .ig-img { display: block; width: 100%; height: auto; border: 2px solid var(--ink); border-radius: 14px; box-shadow: 6px 6px 0 var(--ink); background: var(--paper); }
    .ig-btn { margin-top: 1.1rem; }
    .ig-one { max-width: 460px; margin: 0 auto; }
    .ig-row { display: flex; gap: 1.4rem; overflow-x: auto; scroll-snap-type: x mandatory; padding: 0.5rem 8vw 1.2rem 8vw; -webkit-overflow-scrolling: touch; }
    .ig-slide { flex: 0 0 min(84vw, 420px); scroll-snap-align: center; }
    .ig-slide p { margin: 0 0 0.6rem; font-family: var(--hand); font-size: 1.5rem; font-weight: 700; color: var(--accent); }
    .ig-note { color: var(--muted); font-size: 0.9rem; margin-top: 1.2rem; }
  </style>
</head>
<body>
  <a class="ig-logo" href="../" aria-label="pp hair, home">pp<span>hair</span></a>
  <h1>Carousel post</h1>
  <p class="ig-sub">Two slides, each 1080 &times; 1350. Swipe sideways to look through them, then save each one in order: prices first, then what&rsquo;s included.</p>
  <div class="ig-row">
    <div class="ig-slide"><p>Slide 1 of 2</p><img class="ig-img" src="slide-1-prices.png" width="1080" height="1350" alt="pphair price list"><a class="btn ig-btn" href="slide-1-prices.png" download="pphair-1-prices.png">Download</a></div>
    <div class="ig-slide"><p>Slide 2 of 2</p><img class="ig-img" src="slide-2-included.png" width="1080" height="1350" alt="What's included: color and blowout services"><a class="btn ig-btn" href="slide-2-included.png" download="pphair-2-included.png">Download</a></div>
  </div>
  <p class="ig-note"><a href="prices.html">&larr; Single price image</a></p>
</body>
</html>
